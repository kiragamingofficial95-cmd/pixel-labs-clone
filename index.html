      </div>
    </div>
  </div>
</footer>
</main>

<script>
// Reveal on scroll
const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); observer.unobserve(e.target); } });
}, { threshold: 0.1, rootMargin: '-70px' });
document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

// Header scroll
const header = document.getElementById('header');
window.addEventListener('scroll', () => {
  if (window.scrollY > 12) {
    header.classList.remove('border-transparent','bg-transparent');
    header.classList.add('border-b','border-[hsl(60_5%_89%)]','bg-[hsl(60_33%_99%/0.82)]','shadow-[0_8px_30px_-24px_rgba(10,10,10,0.5)]','backdrop-blur-xl');
  } else {
    header.classList.add('border-transparent','bg-transparent');
    header.classList.remove('border-b','border-[hsl(60_5%_89%)]','bg-[hsl(60_33%_99%/0.82)]','shadow-[0_8px_30px_-24px_rgba(10,10,10,0.5)]','backdrop-blur-xl');
  }
});

// Mobile menu
const menuBtn = document.getElementById('menuBtn');
const mobileMenu = document.getElementById('mobileMenu');
menuBtn.addEventListener('click', () => {
  const open = mobileMenu.classList.toggle('hidden') === false;
  menuBtn.setAttribute('aria-expanded', open);
});

// Progress bar
const progressBar = document.getElementById('progressBar');
window.addEventListener('scroll', () => {
  const h = document.documentElement.scrollHeight - window.innerHeight;
  progressBar.style.transform = 'scaleX(' + (window.scrollY / h) + ')';
});
</script>
</body>
</html>`;
